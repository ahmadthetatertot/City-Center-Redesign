kind = "web"
previewPath = "/"
title = "PC Circle — Landing Page"
version = "1.0.0"
id = "artifacts/pc-circle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22532

[services.development]
run = "pnpm --filter @workspace/pc-circle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pc-circle", "run", "build" ]
serve = "static"
publicDir = "artifacts/pc-circle/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22532"
BASE_PATH = "/"
